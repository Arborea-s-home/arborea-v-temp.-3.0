<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f6f0">
  <title>Occurrences | ARBOREA</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=Spectral:ital,wght@0,500;0,600;1,500;1,600&display=swap">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="record_object.css">
  <link rel="stylesheet" href="occurrence-browser.css">
  <link rel="stylesheet" href="../../assets/site-header.css">
  <link rel="icon" href="../../images/logo_semplificato.png">
  <script type="module" src="../../assets/site-header.js"></script>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" defer></script>
  <script type="module" src="record_object.js"></script>
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <arborea-header data-page="occurrences"></arborea-header>
  <div class="occurrence-layout">
    <aside class="occurrence-sidebar" aria-label="Browse occurrences">
      <div class="occurrence-sidebar-head">
        <h2 id="occurrence-browser-title">Occurrences</h2>
        <button type="button" id="occurrence-sidebar-toggle" aria-expanded="true" aria-controls="occurrence-sidebar-content" aria-label="Collapse occurrence list" title="Collapse occurrence list"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16m7-11-3 3 3 3"/></svg></button>
      </div>
      <div id="occurrence-sidebar-content">
        <label class="occurrence-search-label" for="occurrence-search">Find a site, context or occurrence</label>
        <input type="search" id="occurrence-search" placeholder="Site, context, taxon or ID…" autocomplete="off">
        <p id="occurrence-count" role="status">Loading occurrences…</p>
        <div id="occurrence-tree" aria-labelledby="occurrence-browser-title"></div>
      </div>
    </aside>
    <main id="main" class="wrap" tabindex="-1">
      <div id="sample-view" aria-busy="true"><p class="status" role="status">Loading occurrences…</p></div>
      <noscript><p class="status">Enable JavaScript to browse the occurrences.</p></noscript>
    </main>
  </div>
  <footer class="site-footer"><div class="wrap"><span>ARBOREA</span><a data-route="info" href="../../info/info.html">Project documentation <span aria-hidden="true">↗</span></a></div></footer>
</body>
</html>
